<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Small bag shape -->
  <path d="M25 35 L22 80 Q22 85 30 85 L70 85 Q78 85 78 80 L75 35 Z" fill="#D2B48C" stroke="#4A3728" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Bag top fold -->
  <path d="M25 35 Q35 30 50 32 Q65 30 75 35" fill="#C4A882" stroke="#4A3728" stroke-width="2.5"/>
  <!-- Bag opening -->
  <path d="M30 35 Q50 28 70 35" fill="#F5DEB3" stroke="#4A3728" stroke-width="2"/>
  <!-- Nuts (almonds) -->
  <ellipse cx="40" cy="50" rx="6" ry="4" fill="#8B6914" stroke="#4A3728" stroke-width="2" transform="rotate(-20 40 50)"/>
  <ellipse cx="58" cy="55" rx="5" ry="3.5" fill="#8B6914" stroke="#4A3728" stroke-width="2" transform="rotate(15 58 55)"/>
  <!-- Raisins -->
  <ellipse cx="48" cy="62" rx="4" ry="3" fill="#4A0000" stroke="#4A3728" stroke-width="1.5"/>
  <ellipse cx="35" cy="68" rx="3.5" ry="2.5" fill="#4A0000" stroke="#4A3728" stroke-width="1.5"/>
  <ellipse cx="62" cy="70" rx="4" ry="3" fill="#4A0000" stroke="#4A3728" stroke-width="1.5"/>
  <!-- Seeds -->
  <ellipse cx="52" cy="45" rx="2.5" ry="1.5" fill="#C4A882" stroke="#4A3728" stroke-width="1.5" transform="rotate(30 52 45)"/>
  <ellipse cx="45" cy="75" rx="2.5" ry="1.5" fill="#C4A882" stroke="#4A3728" stroke-width="1.5"/>
  <!-- Peanut -->
  <ellipse cx="55" cy="75" rx="5" ry="3" fill="#D4A574" stroke="#4A3728" stroke-width="1.5" transform="rotate(-10 55 75)"/>
  <line x1="55" y1="72" x2="55" y2="78" stroke="#4A3728" stroke-width="1"/>
</svg>