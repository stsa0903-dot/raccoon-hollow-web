  <!-- Crust arc -->
  <path d="M20 80 Q50 90 80 80" fill="#D4A574" stroke="#4A3728" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="20" y1="80" x2="80" y2="80" stroke="#4A3728" stroke-width="2.5"/>
  <!-- Crust highlight -->
  <path d="M25 80 Q50 86 75 80" fill="none" stroke="#C49454" stroke-width="1.5"/>
  <!-- Pepperoni -->
  <circle cx="45" cy="55" r="6" fill="#CC3333" stroke="#4A3728" stroke-width="2"/>
  <circle cx="58" cy="65" r="5.5" fill="#CC3333" stroke="#4A3728" stroke-width="2"/>
  <circle cx="50" cy="40" r="5" fill="#CC3333" stroke="#4A3728" stroke-width="2"/>
  <circle cx="35" cy="68" r="5" fill="#CC3333" stroke="#4A3728" stroke-width="2"/>
  <!-- Cheese texture lines -->
  <path d="M42 30 Q44 35 40 38" fill="none" stroke="#E6C200" stroke-width="1"/>
  <path d="M60 50 Q62 55 58 58" fill="none" stroke="#E6C200" stroke-width="1"/>
