  <text x="50" y="77" text-anchor="middle" font-family="serif" font-size="14" font-weight="bold" fill="#4A3728">H</text>
  <!-- Honey dipper stick -->
  <line x1="55" y1="20" x2="62" y2="42" stroke="#CD853F" stroke-width="3" stroke-linecap="round"/>
  <rect x="58" y="15" width="8" height="12" rx="3" fill="#CD853F" stroke="#4A3728" stroke-width="2"/>
  <line x1="59" y1="18" x2="65" y2="18" stroke="#4A3728" stroke-width="1"/>
  <line x1="59" y1="21" x2="65" y2="21" stroke="#4A3728" stroke-width="1"/>
  <line x1="59" y1="24" x2="65" y2="24" stroke="#4A3728" stroke-width="1"/>
</svg>