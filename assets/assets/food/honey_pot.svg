<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Pot body -->
  <path d="M25 45 Q22 50 22 60 Q22 80 35 85 L65 85 Q78 80 78 60 Q78 50 75 45 Z" fill="#CD853F" stroke="#4A3728" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Pot rim -->
  <ellipse cx="50" cy="45" rx="25" ry="8" fill="#CD853F" stroke="#4A3728" stroke-width="2.5"/>
  <!-- Pot band -->
  <path d="M26 60 Q50 55 74 60" fill="none" stroke="#4A3728" stroke-width="1.5"/>
  <path d="M25 65 Q50 60 75 65" fill="none" stroke="#4A3728" stroke-width="1.5"/>
  <!-- Honey fill visible at top -->
  <ellipse cx="50" cy="45" rx="20" ry="5" fill="#FFD700" stroke="none"/>
  <!-- Honey drip left -->
  <path d="M30 45 Q28 50 30 58 Q32 62 30 58" fill="#DAA520" stroke="#4A3728" stroke-width="1.5"/>
  <!-- Honey drip right -->
  <path d="M65 44 Q67 52 65 60 Q63 65 66 60" fill="#DAA520" stroke="#4A3728" stroke-width="1.5"/>
