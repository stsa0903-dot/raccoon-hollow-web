<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Left leg -->
  <rect x="15" y="65" width="12" height="35" rx="3" fill="#5D4037"/>
  <rect x="15" y="65" width="12" height="35" rx="3" fill="#6D4C41" opacity="0.5"/>
  <!-- Right leg -->
  <rect x="93" y="65" width="12" height="35" rx="3" fill="#5D4037"/>
  <rect x="93" y="65" width="12" height="35" rx="3" fill="#6D4C41" opacity="0.5"/>
  <!-- Cross braces -->
  <line x1="20" y1="85" x2="100" y2="85" stroke="#5D4037" stroke-width="4" stroke-linecap="round"/>
  <!-- Seat log -->
  <rect x="5" y="50" width="110" height="18" rx="9" fill="#795548"/>
  <!-- Wood grain lines -->
  <line x1="15" y1="56" x2="50" y2="56" stroke="#6D4C41" stroke-width="1.5" opacity="0.5"/>
  <line x1="60" y1="62" x2="100" y2="62" stroke="#6D4C41" stroke-width="1.5" opacity="0.5"/>
  <line x1="30" y1="60" x2="80" y2="60" stroke="#6D4C41" stroke-width="1" opacity="0.4"/>
  <!-- End rings -->
  <ellipse cx="10" cy="59" rx="5" ry="9" fill="#8D6E63"/>
  <ellipse cx="10" cy="59" rx="3" ry="6" fill="#A1887F" opacity="0.5"/>
  <ellipse cx="110" cy="59" rx="5" ry="9" fill="#8D6E63"/>
  <ellipse cx="110" cy="59" rx="3" ry="6" fill="#A1887F" opacity="0.5"/>
  <!-- Ground shadow -->
  <ellipse cx="60" cy="102" rx="48" ry="5" fill="#3E2723" opacity="0.15"/>
</svg>