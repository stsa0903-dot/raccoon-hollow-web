<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Left post -->
  <rect x="8" y="20" width="8" height="85" rx="2" fill="#5D4037"/>
  <rect x="5" y="15" width="14" height="8" rx="3" fill="#6D4C41"/>
  <!-- Right post -->
  <rect x="104" y="20" width="8" height="85" rx="2" fill="#5D4037"/>
  <rect x="101" y="15" width="14" height="8" rx="3" fill="#6D4C41"/>
  <!-- Rope left -->
  <line x1="12" y1="23" x2="25" y2="45" stroke="#8D6E63" stroke-width="2"/>
  <!-- Rope right -->
  <line x1="108" y1="23" x2="95" y2="45" stroke="#8D6E63" stroke-width="2"/>
  <!-- Hammock fabric -->
  <path d="M25,45 Q60,85 95,45" fill="#FF6B9D" opacity="0.8"/>
  <path d="M25,45 Q60,80 95,45" fill="#FF8FB0" opacity="0.6"/>
  <!-- Stripes -->
  <path d="M35,50 Q60,78 85,50" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.4"/>
  <path d="M30,48 Q60,82 90,48" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.3"/>
  <!-- Fringe left -->
  <line x1="25" y1="45" x2="22" y2="52" stroke="#FF6B9D" stroke-width="1.5"/>
  <line x1="27" y1="47" x2="24" y2="54" stroke="#FF6B9D" stroke-width="1.5"/>
  <!-- Fringe right -->
  <line x1="95" y1="45" x2="98" y2="52" stroke="#FF6B9D" stroke-width="1.5"/>
  <line x1="93" y1="47" x2="96" y2="54" stroke="#FF6B9D" stroke-width="1.5"/>
  <!-- Ground shadow -->
  <ellipse cx="60" cy="107" rx="45" ry="4" fill="#3E2723" opacity="0.12"/>
</svg>