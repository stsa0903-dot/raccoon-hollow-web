  <line x1="40" y1="65" x2="38" y2="35" stroke="#4A5E3A" stroke-width="3"/>
  <line x1="60" y1="65" x2="60" y2="25" stroke="#4A5E3A" stroke-width="3"/>
  <line x1="80" y1="65" x2="82" y2="40" stroke="#4A5E3A" stroke-width="3"/>
  <!-- Flower 1 - pink -->
  <circle cx="33" cy="30" r="6" fill="#FF6B9D"/>
  <circle cx="43" cy="30" r="6" fill="#FF6B9D"/>
  <circle cx="38" cy="25" r="6" fill="#FF6B9D"/>
  <circle cx="38" cy="35" r="6" fill="#FF6B9D"/>
  <circle cx="38" cy="30" r="4" fill="#FFD700"/>
  <!-- Flower 2 - red -->
  <circle cx="55" cy="20" r="6" fill="#EF5350"/>
  <circle cx="65" cy="20" r="6" fill="#EF5350"/>
  <circle cx="60" cy="15" r="6" fill="#EF5350"/>
  <circle cx="60" cy="25" r="6" fill="#EF5350"/>
  <circle cx="60" cy="20" r="4" fill="#FFD700"/>
  <!-- Flower 3 - purple -->
  <circle cx="77" cy="35" r="5" fill="#9B59B6"/>
  <circle cx="87" cy="35" r="5" fill="#9B59B6"/>
  <circle cx="82" cy="30" r="5" fill="#9B59B6"/>
  <circle cx="82" cy="40" r="5" fill="#9B59B6"/>
  <circle cx="82" cy="35" r="3" fill="#FFD700"/>
  <!-- Leaves -->
  <ellipse cx="48" cy="50" rx="8" ry="4" fill="#4A5E3A" transform="rotate(-20,48,50)"/>
  <ellipse cx="72" cy="55" rx="8" ry="4" fill="#4A5E3A" transform="rotate(15,72,55)"/>
