<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Body - stocky -->
  <ellipse cx="60" cy="72" rx="28" ry="32" fill="#3E2A1A"/>
  <!-- Belly -->
  <ellipse cx="60" cy="78" rx="18" ry="20" fill="#6E4A30"/>
  <!-- Tail - thick, bushy -->
  <path d="M88,66 Q106,46 102,28 Q98,18 92,26 Q88,38 88,52" fill="#3E2A1A" stroke="#2A1A0E" stroke-width="1.5"/>
  <path d="M92,50 Q100,36 99,28" fill="none" stroke="#2A1A0E" stroke-width="4"/>
  <path d="M90,44 Q96,32 95,26" fill="none" stroke="#6E4A30" stroke-width="2"/>
  <!-- Thorn/scratch marks on body -->
  <line x1="40" y1="65" x2="46" y2="60" stroke="#2A1A0E" stroke-width="1.5"/>
  <line x1="42" y1="62" x2="48" y2="58" stroke="#2A1A0E" stroke-width="1.5"/>
  <line x1="75" y1="70" x2="80" y2="65" stroke="#2A1A0E" stroke-width="1.5"/>
  <!-- Head -->
  <circle cx="60" cy="38" r="22" fill="#4E3A2A"/>
  <!-- Ears - notched, battle-worn -->
  <ellipse cx="43" cy="20" rx="8" ry="10" fill="#4E3A2A"/>
  <ellipse cx="43" cy="20" rx="5" ry="7" fill="#6E4A30"/>
  <path d="M47,14 L50,10 L46,12" fill="#4E3A2A"/>
  <ellipse cx="77" cy="20" rx="8" ry="10" fill="#4E3A2A"/>
  <ellipse cx="77" cy="20" rx="5" ry="7" fill="#6E4A30"/>
  <!-- Mask -->
  <path d="M38,32 Q50,28 60,34 Q70,28 82,32 Q78,42 60,42 Q42,42 38,32Z" fill="#1A0E06"/>
  <!-- Eyes - tough, squinting -->
  <ellipse cx="50" cy="36" rx="5" ry="3" fill="white"/>
  <ellipse cx="70" cy="36" rx="5" ry="3" fill="white"/>
  <circle cx="51" cy="36" r="2" fill="#111"/>
  <circle cx="71" cy="36" r="2" fill="#111"/>
  <!-- Tough furrowed brows -->
  <line x1="43" y1="30" x2="54" y2="33" stroke="#1A0E06" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="77" y1="30" x2="66" y2="33" stroke="#1A0E06" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Scar on face -->
  <line x1="72" y1="28" x2="78" y2="38" stroke="#8A6A50" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Nose -->
  <ellipse cx="60" cy="42" rx="3.5" ry="2.5" fill="#222"/>
  <!-- Tough grin -->
  <path d="M54,47 Q60,50 66,47" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round"/>
  <!-- Feet - big -->
  <ellipse cx="46" cy="102" rx="12" ry="6" fill="#2A1A0E"/>
  <ellipse cx="74" cy="102" rx="12" ry="6" fill="#2A1A0E"/>
  <!-- Arms - crossed tough pose -->
  <path d="M36,62 Q30,68 34,74 Q38,78 44,74" fill="none" stroke="#3E2A1A" stroke-width="7" stroke-linecap="round"/>
  <path d="M84,62 Q90,68 86,74 Q82,78 76,74" fill="none" stroke="#3E2A1A" stroke-width="7" stroke-linecap="round"/>
</svg>