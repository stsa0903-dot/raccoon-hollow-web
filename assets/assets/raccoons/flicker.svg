<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- flicker - nocturnal, charcoal, glowing eyes -->
  <!-- Tail -->
  <ellipse cx="88" cy="78" rx="17" ry="7" fill="#3A3A3A" transform="rotate(-22 88 78)"/>
  <ellipse cx="93" cy="74" rx="13" ry="5" fill="#1A1A1A" transform="rotate(-22 93 74)"/>
  <ellipse cx="98" cy="70" rx="9" ry="4" fill="#3A3A3A" transform="rotate(-22 98 70)"/>
  <!-- Body -->
  <ellipse cx="55" cy="74" rx="22" ry="26" fill="#3A3A3A"/>
  <ellipse cx="55" cy="77" rx="16" ry="18" fill="#5A5A5A"/>
  <!-- Arms -->
  <ellipse cx="36" cy="70" rx="5" ry="10" fill="#3A3A3A" transform="rotate(5 36 70)"/>
  <ellipse cx="74" cy="70" rx="5" ry="10" fill="#3A3A3A" transform="rotate(-5 74 70)"/>
  <!-- Legs -->
  <ellipse cx="44" cy="97" rx="7" ry="5" fill="#2A2A2A"/>
  <ellipse cx="66" cy="97" rx="7" ry="5" fill="#2A2A2A"/>
  <!-- Head -->
  <circle cx="55" cy="38" r="19" fill="#3A3A3A"/>
  <!-- Ears - pointed, alert -->
  <ellipse cx="38" cy="20" rx="5.5" ry="8" fill="#3A3A3A"/>
  <ellipse cx="38" cy="20" rx="3" ry="5" fill="#5A4A5A"/>
  <ellipse cx="72" cy="20" rx="5.5" ry="8" fill="#3A3A3A"/>
  <ellipse cx="72" cy="20" rx="3" ry="5" fill="#5A4A5A"/>
  <!-- Mask -->
  <ellipse cx="45" cy="36" rx="10" ry="7" fill="#1A1A1A"/>
  <ellipse cx="65" cy="36" rx="10" ry="7" fill="#1A1A1A"/>
  <!-- Glowing eyes -->
  <circle cx="47" cy="36" r="5.5" fill="#40E040" opacity="0.2"/>
  <circle cx="63" cy="36" r="5.5" fill="#40E040" opacity="0.2"/>
  <circle cx="47" cy="36" r="4" fill="#40E040"/>
  <circle cx="63" cy="36" r="4" fill="#40E040"/>
  <circle cx="47" cy="36" r="2" fill="#80FF80"/>
  <circle cx="63" cy="36" r="2" fill="#80FF80"/>
  <circle cx="47" cy="36" r="1" fill="white"/>
  <circle cx="63" cy="36" r="1" fill="white"/>
  <!-- Nose -->
  <ellipse cx="55" cy="43" rx="2.5" ry="2" fill="#2A2A2A"/>
  <!-- Subtle mouth -->
  <path d="M50 47 Q55 48 60 47" fill="none" stroke="#2A2A2A" stroke-width="1" stroke-linecap="round"/>
</svg>