<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Golden Nibbles Raccoon - with prominent teeth -->
  <!-- Tail -->
  <ellipse cx="85" cy="95" rx="12" ry="6" fill="#DAA520" transform="rotate(-30 85 95)"/>
  <ellipse cx="92" cy="90" rx="10" ry="5" fill="#B8860B" transform="rotate(-30 92 90)"/>
  <ellipse cx="98" cy="85" rx="8" ry="4" fill="#DAA520" transform="rotate(-30 98 85)"/>
  <!-- Body -->
  <ellipse cx="60" cy="80" rx="25" ry="20" fill="#DAA520"/>
  <!-- Belly -->
  <ellipse cx="60" cy="85" rx="15" ry="12" fill="#FFD700"/>
  <!-- Head -->
  <circle cx="60" cy="45" r="22" fill="#DAA520"/>
  <!-- Ears -->
  <circle cx="42" cy="28" r="8" fill="#DAA520"/>
  <circle cx="42" cy="28" r="5" fill="#FFD700"/>
  <circle cx="78" cy="28" r="8" fill="#DAA520"/>
  <circle cx="78" cy="28" r="5" fill="#FFD700"/>
  <!-- Mask -->
  <ellipse cx="49" cy="44" rx="10" ry="6" fill="#B8860B"/>
  <ellipse cx="71" cy="44" rx="10" ry="6" fill="#B8860B"/>
  <!-- Eyes -->
  <circle cx="50" cy="44" r="3.5" fill="white"/>
  <circle cx="70" cy="44" r="3.5" fill="white"/>
  <circle cx="51" cy="44" r="2" fill="#222"/>
  <circle cx="71" cy="44" r="2" fill="#222"/>
  <!-- Nose -->
  <ellipse cx="60" cy="52" rx="3" ry="2" fill="#222"/>
  <!-- Mouth with teeth -->
  <path d="M56 55 Q60 59 64 55" fill="none" stroke="#222" stroke-width="0.8"/>
  <rect x="58" y="55" width="2" height="3" rx="0.5" fill="white"/>
  <rect x="61" y="55" width="2" height="3" rx="0.5" fill="white"/>
  <!-- Paws holding food -->
  <ellipse cx="45" cy="102" rx="8" ry="4" fill="#B8860B"/>
  <ellipse cx="75" cy="102" rx="8" ry="4" fill="#B8860B"/>
  <!-- Small acorn in paws -->
  <ellipse cx="60" cy="100" rx="4" ry="3" fill="#CD853F"/>
  <rect x="57" y="96" width="6" height="3" rx="1" fill="#8B7355"/>
  <!-- Sparkle details -->
  <polygon points="25,18 26,14 27,18 31,19 27,20 26,24 25,20 21,19" fill="#FFF8DC"/>
  <polygon points="92,18 93,15 94,18 97,19 94,20 93,23 92,20 89,19" fill="#FFF8DC"/>
  <polygon points="15,60 16,57 17,60 20,61 17,62 16,65 15,62 12,61" fill="#FFF8DC"/>
</svg>
