<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Golden Biscuit Raccoon - chubby, round, well-fed -->
  <!-- Tail -->
  <ellipse cx="88" cy="92" rx="13" ry="7" fill="#DAA520" transform="rotate(-25 88 92)"/>
  <ellipse cx="95" cy="87" rx="11" ry="6" fill="#B8860B" transform="rotate(-25 95 87)"/>
  <ellipse cx="101" cy="83" rx="9" ry="5" fill="#DAA520" transform="rotate(-25 101 83)"/>
  <!-- Body - extra round -->
  <ellipse cx="60" cy="80" rx="28" ry="22" fill="#DAA520"/>
  <!-- Big belly -->
  <ellipse cx="60" cy="85" rx="20" ry="16" fill="#FFD700"/>
  <!-- Head - round -->
  <circle cx="60" cy="45" r="23" fill="#DAA520"/>
  <!-- Chubby cheeks -->
  <circle cx="42" cy="50" r="6" fill="#FFD700"/>
  <circle cx="78" cy="50" r="6" fill="#FFD700"/>
  <!-- Ears -->
  <circle cx="42" cy="27" r="8" fill="#DAA520"/>
  <circle cx="42" cy="27" r="5" fill="#FFD700"/>
  <circle cx="78" cy="27" r="8" fill="#DAA520"/>
  <circle cx="78" cy="27" r="5" fill="#FFD700"/>
  <!-- Mask -->
  <ellipse cx="49" cy="44" rx="10" ry="6" fill="#B8860B"/>
  <ellipse cx="71" cy="44" rx="10" ry="6" fill="#B8860B"/>
  <!-- Eyes - happy squints -->
  <path d="M46 44 Q50 41 54 44" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M66 44 Q70 41 74 44" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Nose -->
  <ellipse cx="60" cy="51" rx="3" ry="2" fill="#222"/>
  <!-- Happy mouth -->
  <path d="M55 54 Q60 60 65 54" fill="none" stroke="#222" stroke-width="0.8"/>
  <!-- Feet -->
  <ellipse cx="43" cy="104" rx="9" ry="4" fill="#B8860B"/>
  <ellipse cx="77" cy="104" rx="9" ry="4" fill="#B8860B"/>
  <!-- Sparkle details -->
  <polygon points="20,25 21,21 22,25 26,26 22,27 21,31 20,27 16,26" fill="#FFF8DC"/>
  <polygon points="98,25 99,22 100,25 103,26 100,27 99,30 98,27 95,26" fill="#FFF8DC"/>
  <polygon points="60,5 61,2 62,5 65,6 62,7 61,10 60,7 57,6" fill="#FFF8DC"/>
</svg>
