<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Golden Shadow Raccoon - darker golden tones, sleek look -->
  <!-- Tail -->
  <ellipse cx="85" cy="95" rx="12" ry="6" fill="#B8860B" transform="rotate(-30 85 95)"/>
  <ellipse cx="92" cy="90" rx="10" ry="5" fill="#8B6914" transform="rotate(-30 92 90)"/>
  <ellipse cx="98" cy="85" rx="8" ry="4" fill="#B8860B" transform="rotate(-30 98 85)"/>
  <!-- Body -->
  <ellipse cx="60" cy="80" rx="25" ry="20" fill="#B8860B"/>
  <!-- Belly -->
  <ellipse cx="60" cy="85" rx="15" ry="12" fill="#DAA520"/>
  <!-- Head -->
  <circle cx="60" cy="45" r="22" fill="#B8860B"/>
  <!-- Ears -->
  <circle cx="42" cy="28" r="8" fill="#B8860B"/>
  <circle cx="42" cy="28" r="5" fill="#DAA520"/>
  <circle cx="78" cy="28" r="8" fill="#B8860B"/>
  <circle cx="78" cy="28" r="5" fill="#DAA520"/>
  <!-- Mask - darker -->
  <ellipse cx="49" cy="44" rx="10" ry="6" fill="#8B6914"/>
  <ellipse cx="71" cy="44" rx="10" ry="6" fill="#8B6914"/>
  <!-- Eyes - narrowed/sly -->
  <ellipse cx="50" cy="44" rx="3.5" ry="2.5" fill="white"/>
  <ellipse cx="70" cy="44" rx="3.5" ry="2.5" fill="white"/>
  <circle cx="51" cy="44" r="2" fill="#222"/>
  <circle cx="71" cy="44" r="2" fill="#222"/>
  <!-- Nose -->
  <ellipse cx="60" cy="52" rx="3" ry="2" fill="#222"/>
  <!-- Subtle smirk -->
  <path d="M57 55 Q60 57 64 54" fill="none" stroke="#222" stroke-width="0.8"/>
  <!-- Feet -->
  <ellipse cx="45" cy="102" rx="8" ry="4" fill="#8B6914"/>
  <ellipse cx="75" cy="102" rx="8" ry="4" fill="#8B6914"/>
  <!-- Sparkle details -->
  <polygon points="28,15 29,11 30,15 34,16 30,17 29,21 28,17 24,16" fill="#FFF8DC"/>
  <polygon points="88,12 89,9 90,12 93,13 90,14 89,17 88,14 85,13" fill="#FFF8DC"/>
  <polygon points="105,65 106,62 107,65 110,66 107,67 106,70 105,67 102,66" fill="#FFF8DC"/>
</svg>
