<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Golden Tumble Raccoon - playful, slightly tilted pose -->
  <!-- Tail -->
  <ellipse cx="88" cy="90" rx="12" ry="6" fill="#DAA520" transform="rotate(-45 88 90)"/>
  <ellipse cx="95" cy="84" rx="10" ry="5" fill="#B8860B" transform="rotate(-45 95 84)"/>
  <ellipse cx="100" cy="78" rx="8" ry="4" fill="#DAA520" transform="rotate(-45 100 78)"/>
  <!-- Body - slightly tilted -->
  <ellipse cx="58" cy="80" rx="25" ry="20" fill="#DAA520" transform="rotate(8 58 80)"/>
  <!-- Belly -->
  <ellipse cx="58" cy="85" rx="15" ry="12" fill="#FFD700" transform="rotate(8 58 85)"/>
  <!-- Head - tilted -->
  <circle cx="58" cy="45" r="22" fill="#DAA520"/>
  <!-- Ears -->
  <circle cx="40" cy="28" r="8" fill="#DAA520"/>
  <circle cx="40" cy="28" r="5" fill="#FFD700"/>
  <circle cx="76" cy="30" r="8" fill="#DAA520"/>
  <circle cx="76" cy="30" r="5" fill="#FFD700"/>
  <!-- Mask -->
  <ellipse cx="47" cy="44" rx="10" ry="6" fill="#B8860B"/>
  <ellipse cx="69" cy="44" rx="10" ry="6" fill="#B8860B"/>
  <!-- Eyes - wide and playful -->
  <circle cx="48" cy="43" r="4" fill="white"/>
  <circle cx="68" cy="43" r="4" fill="white"/>
  <circle cx="49" cy="43" r="2.5" fill="#222"/>
  <circle cx="69" cy="43" r="2.5" fill="#222"/>
  <circle cx="50" cy="42" r="1" fill="white"/>
  <circle cx="70" cy="42" r="1" fill="white"/>
  <!-- Nose -->
  <ellipse cx="58" cy="51" rx="3" ry="2" fill="#222"/>
  <!-- Happy mouth -->
  <path d="M54 54 Q58 59 62 54" fill="none" stroke="#222" stroke-width="0.8"/>
  <!-- Feet - one up -->
  <ellipse cx="42" cy="102" rx="8" ry="4" fill="#B8860B"/>
  <ellipse cx="72" cy="98" rx="8" ry="4" fill="#B8860B" transform="rotate(-20 72 98)"/>
  <!-- Sparkle details -->
  <polygon points="18,40 19,36 20,40 24,41 20,42 19,46 18,42 14,41" fill="#FFF8DC"/>
  <polygon points="95,25 96,22 97,25 100,26 97,27 96,30 95,27 92,26" fill="#FFF8DC"/>
  <polygon points="75,10 76,7 77,10 80,11 77,12 76,15 75,12 72,11" fill="#FFF8DC"/>
</svg>
