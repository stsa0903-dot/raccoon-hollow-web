<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Golden Scooter Raccoon - energetic, action pose -->
  <!-- Tail - raised high -->
  <ellipse cx="82" cy="85" rx="12" ry="6" fill="#DAA520" transform="rotate(-50 82 85)"/>
  <ellipse cx="87" cy="77" rx="10" ry="5" fill="#B8860B" transform="rotate(-50 87 77)"/>
  <ellipse cx="91" cy="70" rx="8" ry="4" fill="#DAA520" transform="rotate(-50 91 70)"/>
  <!-- Body - leaning forward -->
  <ellipse cx="58" cy="78" rx="24" ry="19" fill="#DAA520" transform="rotate(10 58 78)"/>
  <!-- Belly -->
  <ellipse cx="58" cy="83" rx="14" ry="11" fill="#FFD700" transform="rotate(10 58 83)"/>
  <!-- Head -->
  <circle cx="55" cy="44" r="22" fill="#DAA520"/>
  <!-- Ears - alert -->
  <circle cx="38" cy="26" r="8" fill="#DAA520"/>
  <circle cx="38" cy="26" r="5" fill="#FFD700"/>
  <circle cx="72" cy="28" r="8" fill="#DAA520"/>
  <circle cx="72" cy="28" r="5" fill="#FFD700"/>
  <!-- Mask -->
  <ellipse cx="44" cy="43" rx="10" ry="6" fill="#B8860B"/>
  <ellipse cx="66" cy="43" rx="10" ry="6" fill="#B8860B"/>
  <!-- Eyes - bright and alert -->
  <circle cx="45" cy="43" r="4" fill="white"/>
  <circle cx="65" cy="43" r="4" fill="white"/>
  <circle cx="46" cy="42" r="2.5" fill="#222"/>
  <circle cx="66" cy="42" r="2.5" fill="#222"/>
  <circle cx="47" cy="41" r="1" fill="white"/>
  <circle cx="67" cy="41" r="1" fill="white"/>
  <!-- Nose -->
  <ellipse cx="55" cy="51" rx="3" ry="2" fill="#222"/>
  <!-- Excited grin -->
  <path d="M50 54 Q55 60 60 54" fill="none" stroke="#222" stroke-width="1"/>
  <!-- Front legs - running -->
  <ellipse cx="38" cy="100" rx="7" ry="4" fill="#B8860B" transform="rotate(15 38 100)"/>
  <ellipse cx="68" cy="104" rx="7" ry="4" fill="#B8860B" transform="rotate(-10 68 104)"/>
  <!-- Motion lines -->
  <line x1="95" y1="65" x2="108" y2="63" stroke="#B8860B" stroke-width="1" stroke-linecap="round"/>
  <line x1="93" y1="72" x2="106" y2="72" stroke="#B8860B" stroke-width="1" stroke-linecap="round"/>
  <line x1="92" y1="79" x2="105" y2="81" stroke="#B8860B" stroke-width="1" stroke-linecap="round"/>
  <!-- Sparkle details -->
  <polygon points="20,18 21,14 22,18 26,19 22,20 21,24 20,20 16,19" fill="#FFF8DC"/>
  <polygon points="80,10 81,7 82,10 85,11 82,12 81,15 80,12 77,11" fill="#FFF8DC"/>
  <polygon points="10,65 11,62 12,65 15,66 12,67 11,70 10,67 7,66" fill="#FFF8DC"/>
</svg>
