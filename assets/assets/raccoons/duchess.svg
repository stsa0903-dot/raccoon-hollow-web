<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Duchess - Elegant lavender raccoon with eyelashes, small tiara -->
  <!-- Tail -->
  <path d="M28 85 Q15 78 12 68 Q9 58 18 55 Q25 53 28 60 Q32 68 35 78" fill="#9B7DB8" stroke="#7A5F96" stroke-width="2.5"/>
  <rect x="11" y="57" width="12" height="4" rx="2" fill="#7A5F96" transform="rotate(-15 17 59)"/>
  <rect x="14" y="64" width="13" height="4" rx="2" fill="#7A5F96" transform="rotate(-5 20 66)"/>
  <rect x="17" y="71" width="13" height="4" rx="2" fill="#7A5F96" transform="rotate(5 23 73)"/>

  <!-- Body -->
  <ellipse cx="60" cy="84" rx="27" ry="25" fill="#9B7DB8" stroke="#7A5F96" stroke-width="2.5"/>
  <!-- Belly -->
  <ellipse cx="60" cy="87" rx="17" ry="17" fill="#C4A8D8" stroke="none"/>

  <!-- Legs -->
  <ellipse cx="47" cy="105" rx="9" ry="6" fill="#9B7DB8" stroke="#7A5F96" stroke-width="2"/>
  <ellipse cx="73" cy="105" rx="9" ry="6" fill="#9B7DB8" stroke="#7A5F96" stroke-width="2"/>

  <!-- Arms - posed elegantly -->
  <path d="M38 76 Q28 82 30 92" fill="none" stroke="#7A5F96" stroke-width="5" stroke-linecap="round"/>
  <path d="M38 76 Q28 82 30 92" fill="none" stroke="#9B7DB8" stroke-width="3" stroke-linecap="round"/>
  <path d="M82 76 Q92 82 90 92" fill="none" stroke="#7A5F96" stroke-width="5" stroke-linecap="round"/>
  <path d="M82 76 Q92 82 90 92" fill="none" stroke="#9B7DB8" stroke-width="3" stroke-linecap="round"/>

  <!-- Head -->
  <ellipse cx="60" cy="43" rx="23" ry="20" fill="#9B7DB8" stroke="#7A5F96" stroke-width="2.5"/>

  <!-- Ears -->
  <ellipse cx="43" cy="27" rx="7" ry="9" fill="#9B7DB8" stroke="#7A5F96" stroke-width="2"/>
  <ellipse cx="43" cy="27" rx="4" ry="5" fill="#D4B8E8" stroke="none"/>
  <ellipse cx="77" cy="27" rx="7" ry="9" fill="#9B7DB8" stroke="#7A5F96" stroke-width="2"/>
  <ellipse cx="77" cy="27" rx="4" ry="5" fill="#D4B8E8" stroke="none"/>

  <!-- Tiara -->
  <path d="M48 25 L52 18 L56 23 L60 15 L64 23 L68 18 L72 25" fill="none" stroke="#FFD700" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="60" cy="16" r="2" fill="#FFD700"/>
  <circle cx="52" cy="19" r="1.5" fill="#FFD700"/>
  <circle cx="68" cy="19" r="1.5" fill="#FFD700"/>

  <!-- Face markings -->
  <ellipse cx="60" cy="41" rx="17" ry="13" fill="#D4B8E8" stroke="none"/>

  <!-- Mask -->
  <path d="M41 38 Q48 33 55 38 Q60 34 65 38 Q72 33 79 38 Q77 44 65 42 Q60 45 55 42 Q43 44 41 38Z" fill="#7A5F96" stroke="none"/>

  <!-- Eyes -->
  <ellipse cx="51" cy="39" rx="4" ry="3.5" fill="white" stroke="none"/>
  <ellipse cx="69" cy="39" rx="4" ry="3.5" fill="white" stroke="none"/>
  <circle cx="52" cy="39" r="2" fill="#5A3D6E"/>
  <circle cx="70" cy="39" r="2" fill="#5A3D6E"/>
  <circle cx="53" cy="38" r="0.7" fill="white"/>
  <circle cx="71" cy="38" r="0.7" fill="white"/>

  <!-- Eyelashes -->
  <path d="M47 36 L45 34" stroke="#5A3D6E" stroke-width="1" stroke-linecap="round"/>
  <path d="M49 35 L48 33" stroke="#5A3D6E" stroke-width="1" stroke-linecap="round"/>
  <path d="M51 35 L51 33" stroke="#5A3D6E" stroke-width="1" stroke-linecap="round"/>
  <path d="M65 36 L63 34" stroke="#5A3D6E" stroke-width="1" stroke-linecap="round"/>
  <path d="M67 35 L66 33" stroke="#5A3D6E" stroke-width="1" stroke-linecap="round"/>
  <path d="M69 35 L69 33" stroke="#5A3D6E" stroke-width="1" stroke-linecap="round"/>

  <!-- Nose -->
  <ellipse cx="60" cy="47" rx="3" ry="2" fill="#7A5F96"/>

  <!-- Gentle smile -->
  <path d="M55 50 Q60 53 65 50" fill="none" stroke="#7A5F96" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Whisker dots -->
  <circle cx="47" cy="47" r="1" fill="#7A5F96"/>
  <circle cx="44" cy="45" r="1" fill="#7A5F96"/>
  <circle cx="73" cy="47" r="1" fill="#7A5F96"/>
  <circle cx="76" cy="45" r="1" fill="#7A5F96"/>
</svg>