<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Silhouette - Generic raccoon shape, solid dark gray, for undiscovered raccoons -->
  <!-- Tail -->
  <path d="M135,155 Q160,142 168,120 Q175,100 165,92 Q155,88 150,100 Q145,115 140,130" fill="#333333"/>
  <!-- Body -->
  <ellipse cx="100" cy="138" rx="45" ry="48" fill="#333333"/>
  <!-- Head -->
  <circle cx="100" cy="70" r="36" fill="#333333"/>
  <!-- Ears -->
  <path d="M70,48 Q62,24 80,38" fill="#333333"/>
  <path d="M130,48 Q138,24 120,38" fill="#333333"/>
  <!-- Arms -->
  <ellipse cx="60" cy="132" rx="12" ry="10" fill="#333333"/>
  <ellipse cx="140" cy="132" rx="12" ry="10" fill="#333333"/>
  <!-- Feet -->
  <ellipse cx="82" cy="182" rx="15" ry="9" fill="#333333"/>
  <ellipse cx="118" cy="182" rx="15" ry="9" fill="#333333"/>
  <!-- Question mark -->
  <text x="100" y="80" font-family="sans-serif" font-size="36" font-weight="bold" fill="#555555" text-anchor="middle">?</text>
</svg>