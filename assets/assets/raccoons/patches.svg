<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Patches - Curious raccoon, standing tall on hind legs, head tilted, wide eyes -->
  <!-- Striped tail hanging behind -->
  <path d="M55 150 Q30 155 20 140 Q12 125 20 115 Q28 108 38 115 Q45 125 50 140" fill="#8b7355" stroke="#3a3020" stroke-width="3.5"/>
  <rect x="17" y="117" width="16" height="5" rx="2.5" fill="#3a3020" stroke="none" transform="rotate(-20 25 119)"/>
  <rect x="19" y="126" width="18" height="5" rx="2.5" fill="#3a3020" stroke="none" transform="rotate(-8 28 128)"/>
  <rect x="22" y="135" width="18" height="5" rx="2.5" fill="#3a3020" stroke="none" transform="rotate(5 31 137)"/>

  <!-- Left leg -->
  <rect x="73" y="162" width="18" height="22" rx="8" fill="#8b7355" stroke="#3a3020" stroke-width="3"/>
  <!-- Right leg -->
  <rect x="109" y="162" width="18" height="22" rx="8" fill="#8b7355" stroke="#3a3020" stroke-width="3"/>
  <!-- Feet -->
  <ellipse cx="82" cy="186" rx="12" ry="7" fill="#5a4030" stroke="#3a3020" stroke-width="2.5"/>
  <ellipse cx="118" cy="186" rx="12" ry="7" fill="#5a4030" stroke="#3a3020" stroke-width="2.5"/>

  <!-- Body (standing upright) -->
  <ellipse cx="100" cy="140" rx="38" ry="35" fill="#8b7355" stroke="#3a3020" stroke-width="3.5"/>
  <!-- Lighter patches on body -->
  <ellipse cx="88" cy="130" rx="12" ry="10" fill="#c4a87a" stroke="none"/>
  <ellipse cx="115" cy="148" rx="10" ry="8" fill="#c4a87a" stroke="none"/>
  <!-- Belly -->
  <ellipse cx="100" cy="145" rx="24" ry="22" fill="#d4c4a0" stroke="none"/>

  <!-- Arms at sides, slightly out -->
  <path d="M65 125 Q50 135 48 150" fill="none" stroke="#3a3020" stroke-width="7" stroke-linecap="round"/>
  <path d="M65 125 Q50 135 48 150" fill="none" stroke="#8b7355" stroke-width="4" stroke-linecap="round"/>
  <circle cx="47" cy="152" r="6" fill="#5a4030" stroke="#3a3020" stroke-width="2"/>

  <path d="M135 125 Q150 135 152 150" fill="none" stroke="#3a3020" stroke-width="7" stroke-linecap="round"/>
  <path d="M135 125 Q150 135 152 150" fill="none" stroke="#8b7355" stroke-width="4" stroke-linecap="round"/>
  <circle cx="153" cy="152" r="6" fill="#5a4030" stroke="#3a3020" stroke-width="2"/>

  <!-- Head (tilted) -->
  <g transform="rotate(12 100 70)">
    <ellipse cx="100" cy="70" rx="36" ry="32" fill="#8b7355" stroke="#3a3020" stroke-width="3.5"/>
    <!-- Light patch on head -->
    <ellipse cx="110" cy="58" rx="10" ry="7" fill="#c4a87a" stroke="none"/>

    <!-- Ears -->
    <ellipse cx="74" cy="44" rx="11" ry="13" fill="#8b7355" stroke="#3a3020" stroke-width="3"/>
    <ellipse cx="74" cy="44" rx="6" ry="8" fill="#d4a08a" stroke="none"/>
    <ellipse cx="126" cy="44" rx="11" ry="13" fill="#8b7355" stroke="#3a3020" stroke-width="3"/>
    <ellipse cx="126" cy="44" rx="6" ry="8" fill="#d4a08a" stroke="none"/>

    <!-- White face -->
    <ellipse cx="100" cy="68" rx="26" ry="20" fill="#e8e0d8" stroke="none"/>

    <!-- Black mask -->
    <path d="M70 60 Q82 53 92 60 Q100 55 108 60 Q118 53 130 60 Q126 70 108 68 Q100 72 92 68 Q74 70 70 60Z" fill="#3a3020" stroke="none"/>

    <!-- Wide curious eyes -->
    <ellipse cx="86" cy="62" rx="7.5" ry="7" fill="white" stroke="none"/>
    <ellipse cx="114" cy="62" rx="7.5" ry="7" fill="white" stroke="none"/>
    <!-- Large pupils (curious look) -->
    <circle cx="86" cy="63" r="4" fill="#3a3020"/>
    <circle cx="114" cy="63" r="4" fill="#3a3020"/>
    <!-- Glint -->
    <circle cx="88" cy="61" r="1.5" fill="white"/>
    <circle cx="116" cy="61" r="1.5" fill="white"/>

    <!-- Small nose -->
    <ellipse cx="100" cy="76" rx="4.5" ry="3" fill="#3a3020" stroke="none"/>

    <!-- Small open mouth (curious) -->
    <ellipse cx="100" cy="82" rx="4" ry="3" fill="#5a3030" stroke="#3a3020" stroke-width="1.5"/>
  </g>
</svg>