<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- jinx - mischievous, dark gray, sneaky grin -->
  <!-- Tail -->
  <ellipse cx="88" cy="76" rx="17" ry="7" fill="#5A5A5A" transform="rotate(-25 88 76)"/>
  <ellipse cx="93" cy="72" rx="13" ry="5" fill="#2A2A2A" transform="rotate(-25 93 72)"/>
  <ellipse cx="98" cy="68" rx="9" ry="4" fill="#5A5A5A" transform="rotate(-25 98 68)"/>
  <!-- Body - slightly crouched -->
  <ellipse cx="55" cy="74" rx="22" ry="26" fill="#5A5A5A"/>
  <ellipse cx="55" cy="77" rx="16" ry="18" fill="#8A8A8A"/>
  <!-- Sneaky hands rubbing together -->
  <ellipse cx="48" cy="62" rx="5" ry="8" fill="#5A5A5A" transform="rotate(25 48 62)"/>
  <ellipse cx="62" cy="62" rx="5" ry="8" fill="#5A5A5A" transform="rotate(-25 62 62)"/>
  <!-- Legs -->
  <ellipse cx="43" cy="97" rx="7" ry="5" fill="#3A3A3A"/>
  <ellipse cx="67" cy="97" rx="7" ry="5" fill="#3A3A3A"/>
  <!-- Head -->
  <circle cx="55" cy="38" r="19" fill="#5A5A5A"/>
  <!-- Ears -->
  <circle cx="40" cy="22" r="6" fill="#5A5A5A"/>
  <circle cx="40" cy="22" r="3.5" fill="#A07080"/>
  <circle cx="70" cy="22" r="6" fill="#5A5A5A"/>
  <circle cx="70" cy="22" r="3.5" fill="#A07080"/>
  <!-- Mask -->
  <ellipse cx="45" cy="36" rx="10" ry="7" fill="#2A2A2A"/>
  <ellipse cx="65" cy="36" rx="10" ry="7" fill="#2A2A2A"/>
  <!-- Eyes - sly half-lidded -->
  <ellipse cx="47" cy="36" rx="4" ry="3" fill="white"/>
  <ellipse cx="63" cy="36" rx="4" ry="3" fill="white"/>
  <circle cx="48" cy="36" r="2" fill="#4A1A1A"/>
  <circle cx="64" cy="36" r="2" fill="#4A1A1A"/>
  <!-- Sneaky eyebrows -->
  <path d="M42 31 L52 33" fill="none" stroke="#2A2A2A" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M68 33 L58 31" fill="none" stroke="#2A2A2A" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Nose -->
  <ellipse cx="55" cy="42" rx="2.5" ry="2" fill="#1A1A1A"/>
  <!-- Sneaky smirk -->
  <path d="M48 46 Q55 49 65 44" fill="none" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
</svg>