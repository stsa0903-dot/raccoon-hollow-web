<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- clover - shy, pale green-gray, peeking pose -->
  <!-- Tail curled around body protectively -->
  <path d="M75 70 Q100 55 95 40 Q90 30 80 35" fill="#8A9A88" stroke="#4A5A48" stroke-width="2"/>
  <path d="M82 50 Q88 42 85 37" fill="none" stroke="#8A9A88" stroke-width="4"/>
  <!-- Body - slightly hunched -->
  <ellipse cx="55" cy="76" rx="21" ry="25" fill="#A0B09E"/>
  <ellipse cx="55" cy="79" rx="15" ry="17" fill="#C8D4C6"/>
  <!-- Arms close to body -->
  <ellipse cx="37" cy="74" rx="5" ry="9" fill="#A0B09E" transform="rotate(5 37 74)"/>
  <ellipse cx="73" cy="74" rx="5" ry="9" fill="#A0B09E" transform="rotate(-5 73 74)"/>
  <!-- Legs -->
  <ellipse cx="45" cy="98" rx="6" ry="4" fill="#6A7A68"/>
  <ellipse cx="65" cy="98" rx="6" ry="4" fill="#6A7A68"/>
  <!-- Head - slightly ducked -->
  <circle cx="55" cy="42" r="18" fill="#A0B09E"/>
  <!-- Ears - folded slightly -->
  <circle cx="40" cy="27" r="6" fill="#A0B09E"/>
  <circle cx="40" cy="27" r="3.5" fill="#C4A0A8"/>
  <circle cx="70" cy="27" r="6" fill="#A0B09E"/>
  <circle cx="70" cy="27" r="3.5" fill="#C4A0A8"/>
  <!-- Mask -->
  <ellipse cx="46" cy="40" rx="9" ry="6" fill="#5A6A58"/>
  <ellipse cx="64" cy="40" rx="9" ry="6" fill="#5A6A58"/>
  <!-- Eyes - shy, looking to the side -->
  <circle cx="47" cy="40" r="3.5" fill="white"/>
  <circle cx="63" cy="40" r="3.5" fill="white"/>
  <circle cx="45" cy="40" r="2" fill="#3A4A3A"/>
  <circle cx="61" cy="40" r="2" fill="#3A4A3A"/>
  <!-- Nose -->
  <ellipse cx="55" cy="46" rx="2.5" ry="1.8" fill="#1A1A1A"/>
  <!-- Shy tiny smile -->
  <path d="M51 49 Q55 51 59 49" fill="none" stroke="#1A1A1A" stroke-width="1" stroke-linecap="round"/>
  <!-- Blush marks -->
  <circle cx="42" cy="45" r="2.5" fill="#D4A0A0" opacity="0.5"/>
  <circle cx="68" cy="45" r="2.5" fill="#D4A0A0" opacity="0.5"/>
</svg>