<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Tumble - Adventurous raccoon, arms spread wide, big smile, red bandana -->
  <!-- Striped tail -->
  <path d="M50 148 Q25 140 18 125 Q12 110 22 105 Q32 100 35 110 Q40 122 48 138" fill="#6a6a6a" stroke="#2a2a2a" stroke-width="3.5"/>
  <rect x="16" y="108" width="15" height="5" rx="2.5" fill="#2a2a2a" stroke="none" transform="rotate(-18 23 110)"/>
  <rect x="19" y="117" width="17" height="5" rx="2.5" fill="#2a2a2a" stroke="none" transform="rotate(-5 27 119)"/>
  <rect x="23" y="126" width="17" height="5" rx="2.5" fill="#2a2a2a" stroke="none" transform="rotate(8 31 128)"/>

  <!-- Left leg -->
  <rect x="76" y="162" width="17" height="22" rx="8" fill="#6a6a6a" stroke="#2a2a2a" stroke-width="3"/>
  <!-- Right leg -->
  <rect x="107" y="162" width="17" height="22" rx="8" fill="#6a6a6a" stroke="#2a2a2a" stroke-width="3"/>
  <!-- Feet -->
  <ellipse cx="84" cy="186" rx="12" ry="7" fill="#3a3a3a" stroke="#2a2a2a" stroke-width="2.5"/>
  <ellipse cx="116" cy="186" rx="12" ry="7" fill="#3a3a3a" stroke="#2a2a2a" stroke-width="2.5"/>

  <!-- Body (upright, energetic) -->
  <ellipse cx="100" cy="138" rx="40" ry="36" fill="#6a6a6a" stroke="#2a2a2a" stroke-width="3.5"/>
  <!-- Belly -->
  <ellipse cx="100" cy="142" rx="25" ry="24" fill="#9a9a9a" stroke="none"/>

  <!-- Left arm (spread wide left) -->
  <path d="M62 118 Q35 100 20 95" fill="none" stroke="#2a2a2a" stroke-width="8" stroke-linecap="round"/>
  <path d="M62 118 Q35 100 20 95" fill="none" stroke="#6a6a6a" stroke-width="5" stroke-linecap="round"/>
  <circle cx="18" cy="94" r="7" fill="#3a3a3a" stroke="#2a2a2a" stroke-width="2"/>
  <!-- Fingers spread -->
  <circle cx="12" cy="89" r="3" fill="#3a3a3a" stroke="#2a2a2a" stroke-width="1.5"/>
  <circle cx="17" cy="86" r="3" fill="#3a3a3a" stroke="#2a2a2a" stroke-width="1.5"/>
  <circle cx="23" cy="88" r="3" fill="#3a3a3a" stroke="#2a2a2a" stroke-width="1.5"/>

  <!-- Right arm (spread wide right) -->
  <path d="M138 118 Q165 100 180 95" fill="none" stroke="#2a2a2a" stroke-width="8" stroke-linecap="round"/>
  <path d="M138 118 Q165 100 180 95" fill="none" stroke="#6a6a6a" stroke-width="5" stroke-linecap="round"/>
  <circle cx="182" cy="94" r="7" fill="#3a3a3a" stroke="#2a2a2a" stroke-width="2"/>
  <!-- Fingers spread -->
  <circle cx="177" cy="88" r="3" fill="#3a3a3a" stroke="#2a2a2a" stroke-width="1.5"/>
  <circle cx="183" cy="86" r="3" fill="#3a3a3a" stroke="#2a2a2a" stroke-width="1.5"/>
  <circle cx="188" cy="89" r="3" fill="#3a3a3a" stroke="#2a2a2a" stroke-width="1.5"/>

  <!-- Red bandana/scarf -->
  <path d="M72 100 Q100 108 128 100 Q125 112 118 115 Q100 120 82 115 Q75 112 72 100Z" fill="#cc3333" stroke="#8a1111" stroke-width="2.5"/>
  <!-- Bandana knot -->
  <circle cx="100" cy="112" r="5" fill="#cc3333" stroke="#8a1111" stroke-width="2"/>
  <!-- Bandana tails -->
  <path d="M96 116 Q90 128 85 132" fill="none" stroke="#cc3333" stroke-width="4" stroke-linecap="round"/>
  <path d="M104 116 Q110 128 115 132" fill="none" stroke="#cc3333" stroke-width="4" stroke-linecap="round"/>
  <path d="M96 116 Q90 128 85 132" fill="none" stroke="#8a1111" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M104 116 Q110 128 115 132" fill="none" stroke="#8a1111" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Head -->
  <ellipse cx="100" cy="68" rx="36" ry="32" fill="#6a6a6a" stroke="#2a2a2a" stroke-width="3.5"/>

  <!-- Ears -->
  <ellipse cx="74" cy="42" rx="11" ry="13" fill="#6a6a6a" stroke="#2a2a2a" stroke-width="3"/>
  <ellipse cx="74" cy="42" rx="6" ry="8" fill="#d4a08a" stroke="none"/>
  <ellipse cx="126" cy="42" rx="11" ry="13" fill="#6a6a6a" stroke="#2a2a2a" stroke-width="3"/>
  <ellipse cx="126" cy="42" rx="6" ry="8" fill="#d4a08a" stroke="none"/>

  <!-- White face -->
  <ellipse cx="100" cy="66" rx="26" ry="20" fill="#e8e0d8" stroke="none"/>

  <!-- Black mask -->
  <path d="M70 58 Q82 51 92 58 Q100 53 108 58 Q120 51 130 58 Q126 68 108 66 Q100 70 92 66 Q74 68 70 58Z" fill="#2a2a2a" stroke="none"/>

  <!-- Big excited eyes -->
  <ellipse cx="86" cy="60" rx="7" ry="6.5" fill="white" stroke="none"/>
  <ellipse cx="114" cy="60" rx="7" ry="6.5" fill="white" stroke="none"/>
  <!-- Pupils -->
  <circle cx="86" cy="61" r="3.5" fill="#2a2a2a"/>
  <circle cx="114" cy="61" r="3.5" fill="#2a2a2a"/>
  <!-- Glints -->
  <circle cx="88" cy="59" r="1.5" fill="white"/>
  <circle cx="116" cy="59" r="1.5" fill="white"/>

  <!-- Nose -->
  <ellipse cx="100" cy="74" rx="4.5" ry="3" fill="#2a2a2a" stroke="none"/>

  <!-- Big open smile -->
  <path d="M88 79 Q100 90 112 79" fill="#5a2020" stroke="#2a2a2a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Tongue -->
  <ellipse cx="100" cy="85" rx="5" ry="3.5" fill="#d46060" stroke="none"/>
</svg>