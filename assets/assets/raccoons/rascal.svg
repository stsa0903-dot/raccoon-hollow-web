<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Rascal - Mischievous, Uncommon - Winking, tongue out, top hat -->
  <!-- Tail behind -->
  <path d="M135,160 Q160,148 170,128 Q180,108 170,98 Q160,93 155,105" fill="#6B4C2A" stroke="#2D2D2D" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M166,124 Q172,118 176,122" fill="none" stroke="#2D2D2D" stroke-width="4" stroke-linecap="round"/>
  <path d="M165,114 Q170,108 174,112" fill="none" stroke="#2D2D2D" stroke-width="4" stroke-linecap="round"/>
  <path d="M162,105 Q166,100 169,104" fill="none" stroke="#2D2D2D" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Body sitting upright, slightly larger -->
  <ellipse cx="100" cy="142" rx="44" ry="46" fill="#6B4C2A" stroke="#2D2D2D" stroke-width="3.5"/>
  <!-- Belly -->
  <ellipse cx="100" cy="148" rx="28" ry="32" fill="#D4C4A8"/>
  <!-- Head -->
  <circle cx="100" cy="68" r="38" fill="#6B4C2A" stroke="#2D2D2D" stroke-width="3.5"/>
  <!-- Face mask - purple tinted -->
  <path d="M72,58 Q82,46 100,54 Q118,46 128,58 Q122,74 100,78 Q78,74 72,58Z" fill="#5C4068"/>
  <!-- Light forehead -->
  <path d="M86,52 Q100,46 114,52 Q100,56 86,52Z" fill="#8B6B50"/>
  <!-- Winking eye (left) -->
  <path d="M82,62 Q88,57 94,62" fill="none" stroke="#2D2D2D" stroke-width="3" stroke-linecap="round"/>
  <!-- Open eye (right) with mischievous look -->
  <ellipse cx="114" cy="62" rx="8" ry="9" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="2"/>
  <ellipse cx="116" cy="63" rx="4.5" ry="5" fill="#2D2D2D"/>
  <circle cx="117.5" cy="61" r="1.8" fill="#FFFFFF"/>
  <!-- Raised eyebrow -->
  <path d="M106,52 Q114,47 124,52" fill="none" stroke="#2D2D2D" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Nose -->
  <ellipse cx="100" cy="70" rx="5" ry="3.5" fill="#2D2D2D"/>
  <!-- Sly grin with tongue -->
  <path d="M88,76 Q100,84 112,76" fill="none" stroke="#2D2D2D" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M104,78 Q108,86 112,78" fill="#E85B7A" stroke="#2D2D2D" stroke-width="1.5"/>
  <!-- Ears -->
  <path d="M68,44 Q60,22 74,34" fill="#6B4C2A" stroke="#2D2D2D" stroke-width="3" stroke-linecap="round"/>
  <path d="M70,37 Q66,28 73,35" fill="#E8B4B8"/>
  <path d="M132,44 Q140,22 126,34" fill="#6B4C2A" stroke="#2D2D2D" stroke-width="3" stroke-linecap="round"/>
  <path d="M130,37 Q134,28 127,35" fill="#E8B4B8"/>
  <!-- Top hat -->
  <rect x="78" y="18" width="44" height="5" rx="2" fill="#2D2D2D" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="84" y="-2" width="32" height="22" rx="3" fill="#2D2D2D" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Hat band -->
  <rect x="84" y="12" width="32" height="5" fill="#5C4068"/>
  <!-- Arms - one on hip, cocky pose -->
  <path d="M60,120 Q45,110 40,100" fill="none" stroke="#6B4C2A" stroke-width="12" stroke-linecap="round"/>
  <path d="M60,120 Q45,110 40,100" fill="none" stroke="#2D2D2D" stroke-width="14" stroke-linecap="round" opacity="0.12"/>
  <path d="M60,120 Q45,110 40,100" fill="none" stroke="#6B4C2A" stroke-width="10" stroke-linecap="round"/>
  <circle cx="40" cy="99" r="8" fill="#6B4C2A" stroke="#2D2D2D" stroke-width="2.5"/>
  <!-- Other arm resting smugly -->
  <ellipse cx="140" cy="130" rx="10" ry="8" fill="#6B4C2A" stroke="#2D2D2D" stroke-width="3"/>
  <!-- Feet -->
  <ellipse cx="82" cy="184" rx="15" ry="8" fill="#6B4C2A" stroke="#2D2D2D" stroke-width="3"/>
  <ellipse cx="118" cy="184" rx="15" ry="8" fill="#6B4C2A" stroke="#2D2D2D" stroke-width="3"/>
</svg>