<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Pebble - stone gray, small and round -->
  <!-- Tail -->
  <path d="M82 88 Q94 82 96 72 Q97 64 90 62 Q85 61 84 66 Q83 72 81 80" fill="#8a8a8a" stroke="#3a3a3a" stroke-width="2"/>
  <rect x="88" y="64" width="8" height="3.5" rx="2" fill="#3a3a3a" transform="rotate(12 92 66)"/>
  <rect x="86" y="69" width="9" height="3.5" rx="2" fill="#3a3a3a" transform="rotate(3 91 71)"/>
  <rect x="84" y="74" width="9" height="3.5" rx="2" fill="#3a3a3a" transform="rotate(-5 89 76)"/>
  <!-- Body - extra round -->
  <ellipse cx="60" cy="86" rx="28" ry="26" fill="#8a8a8a" stroke="#3a3a3a" stroke-width="2"/>
  <ellipse cx="60" cy="89" rx="18" ry="18" fill="#b0b0b0"/>
  <!-- Tiny feet -->
  <ellipse cx="48" cy="108" rx="7" ry="5" fill="#8a8a8a" stroke="#3a3a3a" stroke-width="1.5"/>
  <ellipse cx="72" cy="108" rx="7" ry="5" fill="#8a8a8a" stroke="#3a3a3a" stroke-width="1.5"/>
  <!-- Short arms -->
  <path d="M35 82 Q30 88 33 93" fill="none" stroke="#3a3a3a" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M35 82 Q30 88 33 93" fill="none" stroke="#8a8a8a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M85 82 Q90 88 87 93" fill="none" stroke="#3a3a3a" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M85 82 Q90 88 87 93" fill="none" stroke="#8a8a8a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Head - round -->
  <circle cx="60" cy="44" r="21" fill="#8a8a8a" stroke="#3a3a3a" stroke-width="2"/>
  <!-- Ears - small -->
  <ellipse cx="44" cy="28" rx="6" ry="8" fill="#8a8a8a" stroke="#3a3a3a" stroke-width="2"/>
  <ellipse cx="44" cy="28" rx="3.5" ry="5" fill="#c0a090"/>
  <ellipse cx="76" cy="28" rx="6" ry="8" fill="#8a8a8a" stroke="#3a3a3a" stroke-width="2"/>
  <ellipse cx="76" cy="28" rx="3.5" ry="5" fill="#c0a090"/>
  <!-- Face -->
  <ellipse cx="60" cy="43" rx="15" ry="12" fill="#d8d4d0"/>
  <!-- Mask -->
  <path d="M44 39 Q50 36 56 39 Q60 37 64 39 Q70 36 76 39 Q74 44 64 43 Q60 45 56 43 Q46 44 44 39Z" fill="#3a3a3a"/>
  <!-- Eyes - small round -->
  <circle cx="52" cy="40" r="3" fill="white"/>
  <circle cx="68" cy="40" r="3" fill="white"/>
  <circle cx="53" cy="40" r="1.5" fill="#3a3a3a"/>
  <circle cx="69" cy="40" r="1.5" fill="#3a3a3a"/>
  <circle cx="53.5" cy="39.5" r="0.6" fill="white"/>
  <circle cx="69.5" cy="39.5" r="0.6" fill="white"/>
  <!-- Nose -->
  <ellipse cx="60" cy="47" rx="2.5" ry="1.8" fill="#3a3a3a"/>
  <!-- Tiny smile -->
  <path d="M57 49 Q60 51 63 49" fill="none" stroke="#3a3a3a" stroke-width="1.2" stroke-linecap="round"/>
</svg>