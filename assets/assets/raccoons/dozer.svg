<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Dozer - Lazy, Common - Lying on back, belly up, eyes closed -->
  <!-- Tail on left side -->
  <path d="M25,130 Q10,120 8,105 Q5,90 15,85 Q25,82 30,95" fill="#A89279" stroke="#2D2D2D" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M12,107 Q17,102 22,105" fill="none" stroke="#2D2D2D" stroke-width="4" stroke-linecap="round"/>
  <path d="M10,98 Q15,93 20,96" fill="none" stroke="#2D2D2D" stroke-width="4" stroke-linecap="round"/>
  <path d="M13,90 Q17,86 20,89" fill="none" stroke="#2D2D2D" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Body lying on back - wide ellipse -->
  <ellipse cx="100" cy="120" rx="62" ry="38" fill="#A89279" stroke="#2D2D2D" stroke-width="3.5"/>
  <!-- Plump belly -->
  <ellipse cx="100" cy="115" rx="42" ry="30" fill="#E0D5C5"/>
  <!-- Belly button dot -->
  <circle cx="100" cy="118" r="2" fill="#C5B8A5"/>
  <!-- Head tilted back -->
  <ellipse cx="160" cy="108" rx="28" ry="25" fill="#A89279" stroke="#2D2D2D" stroke-width="3.5"/>
  <!-- Face mask -->
  <path d="M145,100 Q152,90 162,96 Q172,90 178,100 Q174,112 162,115 Q150,112 145,100Z" fill="#6B5D4F"/>
  <!-- Light forehead -->
  <path d="M152,94 Q162,89 172,94 Q162,97 152,94Z" fill="#BDB0A0"/>
  <!-- Closed eyes - happy sleeping -->
  <path d="M150,102 Q154,98 158,102" fill="none" stroke="#2D2D2D" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M165,102 Q169,98 173,102" fill="none" stroke="#2D2D2D" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Relaxed smile -->
  <path d="M157,110 Q162,114 167,110" fill="none" stroke="#2D2D2D" stroke-width="2" stroke-linecap="round"/>
  <!-- Nose -->
  <ellipse cx="162" cy="107" rx="4" ry="3" fill="#2D2D2D"/>
  <!-- Ears -->
  <path d="M143,90 Q138,76 148,82" fill="#A89279" stroke="#2D2D2D" stroke-width="3" stroke-linecap="round"/>
  <path d="M145,85 Q142,80 147,83" fill="#E8B4B8"/>
  <path d="M180,92 Q188,78 180,84" fill="#A89279" stroke="#2D2D2D" stroke-width="3" stroke-linecap="round"/>
  <path d="M181,87 Q184,81 180,85" fill="#E8B4B8"/>
  <!-- Arms flopped out -->
  <path d="M65,100 Q50,80 42,75" fill="none" stroke="#A89279" stroke-width="12" stroke-linecap="round"/>
  <path d="M65,100 Q50,80 42,75" fill="none" stroke="#2D2D2D" stroke-width="14" stroke-linecap="round" opacity="0.12"/>
  <path d="M65,100 Q50,80 42,75" fill="none" stroke="#A89279" stroke-width="10" stroke-linecap="round"/>
  <circle cx="42" cy="74" r="7" fill="#A89279" stroke="#2D2D2D" stroke-width="2.5"/>
  <path d="M130,98 Q140,82 148,80" fill="none" stroke="#A89279" stroke-width="10" stroke-linecap="round"/>
  <!-- Hind feet sticking up -->
  <ellipse cx="48" cy="140" rx="12" ry="9" fill="#A89279" stroke="#2D2D2D" stroke-width="3" transform="rotate(-20,48,140)"/>
  <ellipse cx="72" cy="148" rx="12" ry="9" fill="#A89279" stroke="#2D2D2D" stroke-width="3" transform="rotate(-10,72,148)"/>
  <!-- Toe beans -->
  <circle cx="44" cy="137" r="2" fill="#E8B4B8"/>
  <circle cx="49" cy="135" r="2" fill="#E8B4B8"/>
  <circle cx="54" cy="137" r="2" fill="#E8B4B8"/>
  <!-- Z's for sleeping -->
  <text x="170" y="75" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2D2D2D" opacity="0.5">Z</text>
  <text x="180" y="62" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2D2D2D" opacity="0.35">Z</text>
  <text x="188" y="52" font-family="sans-serif" font-size="8" font-weight="bold" fill="#2D2D2D" opacity="0.2">Z</text>
</svg>