<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Whisper - Shy, Common - Curled up, peeking out -->
  <!-- Tail wrapped around body -->
  <path d="M55,140 Q30,130 25,110 Q20,90 35,85 Q50,80 60,95" fill="#B8B8B8" stroke="#2D2D2D" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Tail stripes -->
  <path d="M33,108 Q38,103 45,105" fill="none" stroke="#2D2D2D" stroke-width="4" stroke-linecap="round"/>
  <path d="M28,100 Q35,94 42,97" fill="none" stroke="#2D2D2D" stroke-width="4" stroke-linecap="round"/>
  <path d="M30,92 Q36,87 40,90" fill="none" stroke="#2D2D2D" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Body curled up -->
  <ellipse cx="100" cy="125" rx="50" ry="42" fill="#C8C8C8" stroke="#2D2D2D" stroke-width="3.5"/>
  <!-- Lighter belly area peeking -->
  <ellipse cx="95" cy="130" rx="30" ry="25" fill="#E8E4E0"/>
  <!-- Head peeking over body -->
  <ellipse cx="120" cy="90" rx="32" ry="28" fill="#C8C8C8" stroke="#2D2D2D" stroke-width="3.5"/>
  <!-- Face mask - raccoon markings -->
  <path d="M100,82 Q110,72 120,78 Q130,72 140,82 Q135,95 120,98 Q105,95 100,82Z" fill="#4A4A4A"/>
  <!-- One visible eye (peeking) -->
  <ellipse cx="118" cy="85" rx="6" ry="7" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="2"/>
  <ellipse cx="119" cy="86" rx="3" ry="3.5" fill="#2D2D2D"/>
  <circle cx="120" cy="84.5" r="1.2" fill="#FFFFFF"/>
  <!-- Other eye hidden/squinting -->
  <path d="M106,84 Q109,87 112,84" fill="none" stroke="#2D2D2D" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Nose -->
  <ellipse cx="120" cy="92" rx="4" ry="3" fill="#2D2D2D"/>
  <!-- Tiny worried mouth -->
  <path d="M117,96 Q120,95 123,96" fill="none" stroke="#2D2D2D" stroke-width="2" stroke-linecap="round"/>
  <!-- Ears -->
  <path d="M98,72 Q95,58 105,65" fill="#C8C8C8" stroke="#2D2D2D" stroke-width="3" stroke-linecap="round"/>
  <path d="M100,68 Q99,63 104,66" fill="#E8B4B8"/>
  <path d="M138,72 Q145,58 140,65" fill="#C8C8C8" stroke="#2D2D2D" stroke-width="3" stroke-linecap="round"/>
  <path d="M139,68 Q142,63 140,66" fill="#E8B4B8"/>
  <!-- Front paws clutching body -->
  <ellipse cx="80" cy="108" rx="10" ry="8" fill="#C8C8C8" stroke="#2D2D2D" stroke-width="3"/>
  <path d="M74,106 L76,110 M78,105 L79,109 M82,105 L82,109" stroke="#2D2D2D" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Light forehead patch -->
  <path d="M112,75 Q120,70 128,75 Q120,78 112,75Z" fill="#E0E0E0"/>
</svg>