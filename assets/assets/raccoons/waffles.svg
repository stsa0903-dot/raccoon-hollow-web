<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Body - slightly rounder for glutton -->
  <ellipse cx="60" cy="72" rx="30" ry="34" fill="#C8961E"/>
  <!-- Belly -->
  <ellipse cx="60" cy="78" rx="20" ry="22" fill="#E8C86E"/>
  <!-- Tail -->
  <path d="M90,68 Q108,50 104,34 Q100,24 94,34 Q90,44 90,56" fill="#C8961E" stroke="#8A6610" stroke-width="1"/>
  <path d="M93,54 Q100,42 98,35" fill="none" stroke="#8A6610" stroke-width="3"/>
  <path d="M91,48 Q97,38 95,33" fill="none" stroke="#E8C86E" stroke-width="2"/>
  <!-- Head -->
  <circle cx="60" cy="38" r="22" fill="#D4A828"/>
  <!-- Ears -->
  <ellipse cx="43" cy="20" rx="8" ry="9" fill="#D4A828"/>
  <ellipse cx="43" cy="20" rx="5" ry="6" fill="#E8C86E"/>
  <ellipse cx="77" cy="20" rx="8" ry="9" fill="#D4A828"/>
  <ellipse cx="77" cy="20" rx="5" ry="6" fill="#E8C86E"/>
  <!-- Mask -->
  <path d="M38,32 Q50,28 60,34 Q70,28 82,32 Q78,42 60,42 Q42,42 38,32Z" fill="#6B4400"/>
  <!-- Eyes - happy, food-loving -->
  <ellipse cx="50" cy="35" rx="5" ry="4" fill="white"/>
  <ellipse cx="70" cy="35" rx="5" ry="4" fill="white"/>
  <circle cx="51" cy="36" r="2.5" fill="#111"/>
  <circle cx="71" cy="36" r="2.5" fill="#111"/>
  <!-- Star sparkles in eyes -->
  <circle cx="52" cy="35" r="0.8" fill="white"/>
  <circle cx="72" cy="35" r="0.8" fill="white"/>
  <!-- Nose -->
  <ellipse cx="60" cy="42" rx="3" ry="2" fill="#222"/>
  <!-- Drooling mouth -->
  <path d="M54,46 Q60,52 66,46" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M60,50 Q60,56 62,60" fill="none" stroke="#7CB8E8" stroke-width="2" stroke-linecap="round"/>
  <!-- Drool drop -->
  <ellipse cx="62" cy="62" rx="2" ry="3" fill="#7CB8E8" opacity="0.7"/>
  <!-- Stuffed cheeks -->
  <circle cx="42" cy="42" r="6" fill="#E0A030" opacity="0.6"/>
  <circle cx="78" cy="42" r="6" fill="#E0A030" opacity="0.6"/>
  <!-- Feet -->
  <ellipse cx="46" cy="104" rx="11" ry="5" fill="#8A6610"/>
  <ellipse cx="74" cy="104" rx="11" ry="5" fill="#8A6610"/>
  <!-- Arms - holding belly -->
  <path d="M34,68 Q28,78 34,85" fill="none" stroke="#C8961E" stroke-width="6" stroke-linecap="round"/>
  <path d="M86,68 Q92,78 86,85" fill="none" stroke="#C8961E" stroke-width="6" stroke-linecap="round"/>
</svg>