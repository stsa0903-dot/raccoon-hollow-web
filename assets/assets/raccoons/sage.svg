<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Mystical leaf particles -->
  <ellipse cx="14" cy="25" rx="3" ry="1.5" fill="#40A060" opacity="0.4" transform="rotate(-30,14,25)"/>
  <ellipse cx="106" cy="30" rx="2.5" ry="1.2" fill="#40A060" opacity="0.3" transform="rotate(20,106,30)"/>
  <ellipse cx="18" cy="80" rx="2" ry="1" fill="#60B070" opacity="0.3" transform="rotate(-15,18,80)"/>
  <!-- Wisdom aura -->
  <circle cx="60" cy="55" r="50" fill="#208040" opacity="0.05"/>
  <circle cx="60" cy="55" r="42" fill="#208040" opacity="0.05"/>
  <!-- Body -->
  <ellipse cx="60" cy="72" rx="27" ry="31" fill="#2A6040"/>
  <!-- Vine/leaf pattern on body -->
  <path d="M42,65 Q46,60 50,65 Q48,58 52,55" fill="none" stroke="#40804A" stroke-width="1.2" opacity="0.6"/>
  <path d="M70,68 Q74,63 78,68 Q76,61 80,58" fill="none" stroke="#40804A" stroke-width="1.2" opacity="0.6"/>
  <!-- Small leaf on shoulder -->
  <ellipse cx="38" cy="58" rx="4" ry="2" fill="#50A058" transform="rotate(-20,38,58)"/>
  <line x1="36" y1="58" x2="40" y2="58" stroke="#3A7A40" stroke-width="0.5"/>
  <!-- Belly -->
  <ellipse cx="60" cy="78" rx="18" ry="20" fill="#3A8050"/>
  <!-- Emerald gem pattern on belly -->
  <path d="M56,74 L60,68 L64,74 L60,76Z" fill="#50C068" opacity="0.4" stroke="#40A058" stroke-width="0.5"/>
  <!-- Tail -->
  <path d="M87,66 Q104,46 100,28 Q96,18 90,26 Q86,38 87,52" fill="#2A6040" stroke="#1A4028" stroke-width="1.5"/>
  <path d="M91,50 Q98,38 97,30" fill="none" stroke="#1A4028" stroke-width="3"/>
  <path d="M89,44 Q95,34 94,28" fill="none" stroke="#3A8050" stroke-width="2"/>
  <!-- Leaf on tail -->
  <ellipse cx="98" cy="24" rx="5" ry="2.5" fill="#50A058" transform="rotate(-40,98,24)"/>
  <!-- Head -->
  <circle cx="60" cy="38" r="23" fill="#307048"/>
  <!-- Wise third-eye marking -->
  <path d="M56,20 L60,16 L64,20 L60,22Z" fill="#60C070" opacity="0.5"/>
  <!-- Ears -->
  <ellipse cx="42" cy="20" rx="8" ry="10" fill="#307048"/>
  <ellipse cx="42" cy="20" rx="5" ry="7" fill="#3A8050"/>
  <ellipse cx="78" cy="20" rx="8" ry="10" fill="#307048"/>
  <ellipse cx="78" cy="20" rx="5" ry="7" fill="#3A8050"/>
  <!-- Leaf tufts on ears -->
  <ellipse cx="42" cy="10" rx="3" ry="1.5" fill="#50A058" transform="rotate(-10,42,10)"/>
  <ellipse cx="78" cy="10" rx="3" ry="1.5" fill="#50A058" transform="rotate(10,78,10)"/>
  <!-- Mask -->
  <path d="M37,32 Q50,28 60,34 Q70,28 83,32 Q79,43 60,43 Q41,43 37,32Z" fill="#14302A"/>
  <!-- Eyes - deep, wise, knowing -->
  <ellipse cx="50" cy="36" rx="5.5" ry="5" fill="#C0F0D0"/>
  <ellipse cx="70" cy="36" rx="5.5" ry="5" fill="#C0F0D0"/>
  <circle cx="50" cy="36" r="3" fill="#106030"/>
  <circle cx="70" cy="36" r="3" fill="#106030"/>
  <circle cx="50" cy="36" r="1.5" fill="#40C060"/>
  <circle cx="70" cy="36" r="1.5" fill="#40C060"/>
  <circle cx="51.5" cy="34.5" r="0.8" fill="white"/>
  <circle cx="71.5" cy="34.5" r="0.8" fill="white"/>
  <!-- Wise contemplative brows -->
  <path d="M43,28 Q48,26 55,29" fill="none" stroke="#14302A" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M65,29 Q72,26 77,28" fill="none" stroke="#14302A" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Nose -->
  <ellipse cx="60" cy="43" rx="3" ry="2" fill="#0A2018"/>
  <!-- Wise knowing smile -->
  <path d="M55,47 Q60,50 65,47" fill="none" stroke="#0A2018" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Spectacles/wise look marks -->
  <circle cx="50" cy="36" r="7" fill="none" stroke="#40805A" stroke-width="0.6" opacity="0.4"/>
  <circle cx="70" cy="36" r="7" fill="none" stroke="#40805A" stroke-width="0.6" opacity="0.4"/>
  <!-- Staff/walking stick -->
  <line x1="96" y1="46" x2="100" y2="105" stroke="#6A5030" stroke-width="3" stroke-linecap="round"/>
  <circle cx="96" cy="44" r="3" fill="#50C068" opacity="0.6"/>
  <!-- Feet -->
  <ellipse cx="48" cy="101" rx="10" ry="5" fill="#1A4028"/>
  <ellipse cx="72" cy="101" rx="10" ry="5" fill="#1A4028"/>
  <!-- Arms -->
  <path d="M35,62 Q26,68 24,76" fill="none" stroke="#2A6040" stroke-width="6" stroke-linecap="round"/>
  <path d="M85,62 Q92,56 96,50" fill="none" stroke="#2A6040" stroke-width="6" stroke-linecap="round"/>
</svg>