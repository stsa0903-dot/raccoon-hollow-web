  <rect x="80" y="50" width="9" height="3.5" rx="2" fill="#2a2a2a" transform="rotate(-5 85 52)"/>
  <rect x="79" y="56" width="9" height="3.5" rx="2" fill="#2a2a2a" transform="rotate(-10 84 58)"/>
  <!-- Body - slightly tilted -->
  <ellipse cx="58" cy="84" rx="24" ry="24" fill="#7a7a7a" stroke="#2a2a2a" stroke-width="2"/>
  <ellipse cx="58" cy="87" rx="15" ry="15" fill="#a8a8a8"/>
  <!-- Feet - one lifted -->
  <ellipse cx="46" cy="104" rx="8" ry="5" fill="#7a7a7a" stroke="#2a2a2a" stroke-width="1.5"/>
  <ellipse cx="70" cy="102" rx="8" ry="5" fill="#7a7a7a" stroke="#2a2a2a" stroke-width="1.5" transform="rotate(-10 70 102)"/>
