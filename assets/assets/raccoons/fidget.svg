  <path d="M36 76 Q28 70 25 62" fill="none" stroke="#7a7a7a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="24" cy="60" r="4" fill="#5a5a5a" stroke="#2a2a2a" stroke-width="1.5"/>
  <path d="M80 78 Q86 85 84 92" fill="none" stroke="#2a2a2a" stroke-width="5" stroke-linecap="round"/>
  <path d="M80 78 Q86 85 84 92" fill="none" stroke="#7a7a7a" stroke-width="3" stroke-linecap="round"/>
  <!-- Head - slightly tilted -->
  <ellipse cx="58" cy="42" rx="22" ry="20" fill="#7a7a7a" stroke="#2a2a2a" stroke-width="2"/>
  <!-- Ears - perked up -->
  <ellipse cx="41" cy="25" rx="7" ry="10" fill="#7a7a7a" stroke="#2a2a2a" stroke-width="2"/>
  <ellipse cx="41" cy="25" rx="4" ry="6" fill="#d4a08a"/>
  <ellipse cx="75" cy="25" rx="7" ry="10" fill="#7a7a7a" stroke="#2a2a2a" stroke-width="2"/>
  <ellipse cx="75" cy="25" rx="4" ry="6" fill="#d4a08a"/>
  <!-- Face -->
  <ellipse cx="58" cy="41" rx="16" ry="13" fill="#d8d0c8"/>
  <!-- Mask -->
  <path d="M40 37 Q47 33 54 37 Q58 34 62 37 Q69 33 76 37 Q74 43 62 42 Q58 44 54 42 Q42 43 40 37Z" fill="#2a2a2a"/>
  <!-- Eyes - wide alert -->
  <ellipse cx="50" cy="38" rx="4.5" ry="4.5" fill="white"/>
  <ellipse cx="66" cy="38" rx="4.5" ry="4.5" fill="white"/>
  <circle cx="51" cy="37" r="2.5" fill="#2a2a2a"/>
  <circle cx="67" cy="37" r="2.5" fill="#2a2a2a"/>
  <circle cx="52" cy="36.5" r="1" fill="white"/>
  <circle cx="68" cy="36.5" r="1" fill="white"/>
  <!-- Nose -->
  <ellipse cx="58" cy="46" rx="3" ry="2" fill="#2a2a2a"/>
  <!-- Nervous mouth -->
  <path d="M53 49 Q56 50 58 49 Q60 50 63 49" fill="none" stroke="#2a2a2a" stroke-width="1.2" stroke-linecap="round"/>
