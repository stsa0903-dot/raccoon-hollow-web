<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Box body -->
  <rect x="20" y="45" width="60" height="40" rx="2" fill="#C4A35A" stroke="#2C1810" stroke-width="2.5"/>
  <!-- Front face darker stripe -->
  <rect x="20" y="65" width="60" height="20" rx="0" fill="#B8963E" stroke="none"/>
  <rect x="20" y="45" width="60" height="40" rx="2" fill="none" stroke="#2C1810" stroke-width="2.5"/>
  <!-- Left flap -->
  <polygon points="20,45 10,30 30,30 40,45" fill="#B8963E" stroke="#2C1810" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Right flap -->
  <polygon points="60,45 70,30 90,30 80,45" fill="#B8963E" stroke="#2C1810" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Back left flap -->
  <polygon points="30,45 35,28 50,28 50,45" fill="#C4A35A" stroke="#2C1810" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Back right flap -->
  <polygon points="50,45 50,28 65,28 70,45" fill="#C4A35A" stroke="#2C1810" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Box center line -->
  <line x1="50" y1="45" x2="50" y2="85" stroke="#2C1810" stroke-width="1.5"/>
</svg>