<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Hat brim -->
  <ellipse cx="50" cy="75" rx="35" ry="10" fill="#2C1810" stroke="#2C1810" stroke-width="2.5"/>
  <!-- Hat body -->
  <rect x="28" y="30" width="44" height="45" rx="3" fill="#2C1810" stroke="#1A0E08" stroke-width="2.5"/>
  <!-- Hat top -->
  <ellipse cx="50" cy="30" rx="22" ry="6" fill="#3D2517" stroke="#1A0E08" stroke-width="2.5"/>
  <!-- Purple band -->
  <rect x="28" y="62" width="44" height="8" fill="#9B59B6" stroke="none"/>
  <line x1="28" y1="62" x2="72" y2="62" stroke="#1A0E08" stroke-width="1"/>
  <line x1="28" y1="70" x2="72" y2="70" stroke="#1A0E08" stroke-width="1"/>
  <!-- Sparkle stars -->
  <polygon points="18,25 20,20 22,25 20,22" fill="#FFD700" stroke="none"/>
  <polygon points="80,20 82,15 84,20 82,17" fill="#FFD700" stroke="none"/>
  <polygon points="15,50 17,45 19,50 17,47" fill="#FFD700" stroke="none"/>
  <polygon points="82,45 84,40 86,45 84,42" fill="#FFD700" stroke="none"/>
  <polygon points="75,65 77,60 79,65 77,62" fill="#FFD700" stroke="none"/>
  <!-- 4-point stars -->
  <path d="M12,38 L14,33 L16,38 L14,43 Z" fill="#FFD700"/>
  <path d="M86,32 L88,27 L90,32 L88,37 Z" fill="#FFD700"/>
