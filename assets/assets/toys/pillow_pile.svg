<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Bottom pillow (lavender) -->
  <rect x="12" y="58" width="76" height="24" rx="12" ry="12" fill="#E6E6FA" stroke="#2C1810" stroke-width="2.5"/>
  <!-- Bottom pillow seam -->
  <line x1="50" y1="60" x2="50" y2="80" stroke="#2C1810" stroke-width="1" opacity="0.3"/>
  <!-- Middle pillow (pink) -->
  <rect x="18" y="40" width="64" height="22" rx="11" ry="11" fill="#FFB6C1" stroke="#2C1810" stroke-width="2.5"/>
  <!-- Middle pillow seam -->
  <line x1="50" y1="42" x2="50" y2="60" stroke="#2C1810" stroke-width="1" opacity="0.3"/>
  <!-- Top pillow (plum) - slightly rotated look -->
  <rect x="24" y="22" width="56" height="22" rx="11" ry="11" fill="#DDA0DD" stroke="#2C1810" stroke-width="2.5" transform="rotate(-5, 52, 33)"/>
  <!-- Top pillow seam -->
  <line x1="50" y1="24" x2="49" y2="42" stroke="#2C1810" stroke-width="1" opacity="0.3" transform="rotate(-5, 52, 33)"/>
</svg>