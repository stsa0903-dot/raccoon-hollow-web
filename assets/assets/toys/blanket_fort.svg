<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Left stick -->
  <line x1="22" y1="85" x2="32" y2="20" stroke="#8B6914" stroke-width="4" stroke-linecap="round"/>
  <line x1="22" y1="85" x2="32" y2="20" stroke="#2C1810" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.3"/>
  <!-- Right stick -->
  <line x1="78" y1="85" x2="68" y2="20" stroke="#8B6914" stroke-width="4" stroke-linecap="round"/>
  <line x1="78" y1="85" x2="68" y2="20" stroke="#2C1810" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.3"/>
  <!-- Blanket draped over sticks -->
  <path d="M28,25 Q50,15 72,25 L85,80 Q50,70 15,80 Z" fill="#4682B4" stroke="#2C1810" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Blanket opening (dark interior) -->
  <path d="M35,80 Q50,68 65,80 Z" fill="#1a1a2e" stroke="#2C1810" stroke-width="2" stroke-linejoin="round"/>
  <!-- Blanket drape folds -->
  <path d="M38,35 Q42,55 36,75" fill="none" stroke="#3A6F9A" stroke-width="1.5" opacity="0.5"/>
  <path d="M62,35 Q58,55 64,75" fill="none" stroke="#3A6F9A" stroke-width="1.5" opacity="0.5"/>
  <!-- Stick tops visible above blanket -->
  <circle cx="32" cy="20" r="3" fill="#8B6914" stroke="#2C1810" stroke-width="2"/>
  <circle cx="68" cy="20" r="3" fill="#8B6914" stroke="#2C1810" stroke-width="2"/>
</svg>